name: Optimization worker CI

on:
  push:
    branches: [main]
    paths:
      - "workers/optimization/**"
      - ".github/workflows/optimization-worker.yml"
  pull_request:
    paths:
      - "workers/optimization/**"
      - ".github/workflows/optimization-worker.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/optimization
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - name: Install contract test dependencies
        # Match the worker's direct FastAPI/Pydantic pins. Model libraries are
        # unnecessary: execution and artifact downloads are mocked by the suite.
        run: python -m pip install fastapi==0.116.1 pydantic==2.11.7 httpx==0.28.1
      - name: Offline worker and downloader contract tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
