name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Engine unit tests (offline, no creds)
      # Standalone suite over prompt_optimizer.py — fully mocked (FakeClient/
      # FakeEndpoint), hits no endpoint. manage.py test cannot discover it
      # (not a Django TestCase); run it directly. Exits non-zero on failure.
      run: python test/test_prompt_optimizer.py
    - name: Django app tests
      run: |
        export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
        python -m unittest test.test_config_security
        python webapp_django/manage.py test optimizer
    - name: Endpoint attribution tests (offline)
      run: python -m unittest test.test_llm_endpoint
